      --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {

      font-family: var(--sans);
      background: var(--crema);
      color: var(--tinta);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--crema-clara);
      outline-offset: 2px;
    }

    .cabecera {
      background: linear-gradient(135deg, var(--terracota) 0%, var(--terracota-oscura) 100%);

      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--sombra-media);
      flex-shrink: 0;
      z-index: 10;
    }

    .cab-izq {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cab-icono {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: var(--radio-chico);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cab-icono svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
    }

    .cab-marca {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(253, 248, 243, 0.72);
      letter-spacing: 0.2px;
    }

    .cab-titulo {
      font-size: 16px;
      font-weight: 700;
      color: var(--crema-clara);
      line-height: 1.2;
      white-space: nowrap;
    }

    .pestanas-modulo {
      display: flex;
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: rgba(44, 36, 22, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .pestana-modulo {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 16px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: rgba(253, 248, 243, 0.8);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .pestana-modulo svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .pestana-modulo:hover {
      color: var(--crema-clara);
      background: rgba(255, 255, 255, 0.08);
    }

    .pestana-modulo[aria-selected=true] {
      background: var(--crema-clara);
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
    }

    .cab-der {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .selector-version {
      display: flex;
      padding: 2px;
      border-radius: 20px;
      background: rgba(44, 36, 22, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .selector-version button {
      height: 24px;
      padding: 0 12px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: rgba(253, 248, 243, 0.78);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .selector-version button:hover {
      color: var(--crema-clara);
    }

    .selector-version button[aria-pressed=true] {
      background: var(--crema-clara);
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
    }

    .medidor {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .medidor-barras {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 18px;
    }

    .medidor-barras span {
      width: 4px;
      border-radius: 1px;
      opacity: 0.18;
      transition: opacity 0.06s linear;
    }

    .medidor-barras span.prendida {
      opacity: 1;
    }

    .medidor-valor {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--crema-clara);
      min-width: 78px;
      text-align: right;
    }

    .cab-version {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--crema-clara);
      border-radius: 20px;
    }

    .escenario {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .marco-modulo {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--crema);
    }

    .marco-modulo[hidden] {
      display: none;
    }

    .aviso-contenedor {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 9px 16px;
      border-radius: 8px;
      background: rgba(44, 36, 22, 0.92);
      color: var(--crema-clara);
      font-size: 12.5px;
      box-shadow: var(--sombra-media);
      z-index: 20;
    }

    .aviso-contenedor[hidden] {
      display: none;
    }

    @media (max-width: 1100px) {
      .cab-marca {
        display: none;
      }

      .medidor-barras {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .cabecera {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
      }

      .pestanas-modulo {
        order: 3;
        width: 100%;
      }

      .pestana-modulo {
        flex: 1;
        justify-content: center;
      }

      .medidor-valor {
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

      gap: 5px;
      background: var(--crema-clara);

    }

      color: var(--tinta-media);

    .mini {
      height: 24px;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--borde);
      background: #fff;
      color: var(--tinta-media);
      cursor: pointer;

    .mini:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mini:hover:not(:disabled) {
      border-color: var(--terracota-clara);
      color: var(--terracota);
    }

    .mini.prendido {
      background: var(--salvia-oscura);
      border-color: var(--salvia-oscura);
      color: #fff;
    }

    .caja-consejo {
      background: linear-gradient(135deg, rgba(155, 176, 143, 0.14), rgba(155, 176, 143, 0.04));

      font-size: 11px;
      color: var(--tinta-media);

      font-size: 11.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      margin-bottom: 2px;

    .caja-consejo p + p {
      margin-top: 5px;
    }

    .devolucion {
      font-size: 11px;
      line-height: 1.6;
      border-radius: var(--radio-chico);
      padding: 7px 9px;
      background: var(--crema-clara);
      border: 1px solid var(--crema-oscura);
    }

    .devolucion .bien {
      color: var(--salvia-oscura);
      font-weight: 600;
    }

    .devolucion .mal {
      color: var(--terracota);
      font-weight: 600;
    }

    .marcador {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--madera);
      text-align: center;
    }

    .historial {
      list-style: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tinta-media);
      max-height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pie-audio {
      border-top: 1px solid var(--borde);
      background: var(--crema-clara);
      padding: 9px 9px 10px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .boton-reproducir {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      background: linear-gradient(135deg, var(--salvia) 0%, var(--salvia-oscura) 100%);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      border: 0;
      border-radius: var(--radio-medio);

    .boton-reproducir svg {

      height: 13px;
    }

    .boton-reproducir:hover {
      transform: translateY(-1px);
      box-shadow: var(--sombra-media);
    }

    .boton-reproducir.sonando {
      background: linear-gradient(135deg, var(--terracota-clara), var(--terracota));
      animation: latido 2s ease-in-out infinite;
    }

    @keyframes latido {
      0%, 100% { box-shadow: var(--sombra-chica); }
      50% { box-shadow: 0 0 0 5px rgba(184, 92, 80, 0.18), var(--sombra-chica); }

    .valor-nivel {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      min-width: 58px;
      text-align: right;
    }

    .interruptor {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--tinta-media);
    }

    .llave {
      position: relative;
      width: 32px;
      height: 17px;
      flex-shrink: 0;
    }

    .llave input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .llave-pista {
      position: absolute;
      inset: 0;
      background: var(--crema-oscura);
      border: 1px solid var(--borde);
      border-radius: 9px;
      transition: background 0.15s;
      pointer-events: none;
    }

    .llave-pista::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--sombra-chica);
      transition: left 0.15s;
    }

    .llave input:checked + .llave-pista {
      background: var(--salvia-oscura);
      border-color: var(--salvia-oscura);
    }

    .llave input:checked + .llave-pista::after {
      left: calc(100% - 13px);
    }

    .llave input:focus-visible + .llave-pista {
      outline: 2px solid var(--terracota);
      outline-offset: 2px;
    }

    .panel-der {
      display: flex;
      flex-direction: column;
      background: var(--crema-clara);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .barra-herramientas {
      padding: 8px 14px;
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .grafico-titulo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .grafico-subtitulo {
      font-size: 10.5px;
      color: var(--tenue);
      margin-top: 1px;
    }

    .herramientas {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .pastilla {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
    }

    .pastilla-fc {
      color: var(--salvia-oscura);
      border-color: var(--salvia);
      background: rgba(155, 176, 143, 0.1);
    }

    .pastilla-tipo {
      color: var(--terracota);
      border-color: var(--terracota-clara);
      background: rgba(184, 92, 80, 0.07);
    }

    .pastilla-pend {
      color: var(--madera);
      border-color: var(--arena);
      background: rgba(166, 123, 91, 0.08);
    }

    .separador {
      width: 1px;
      height: 16px;
      background: var(--borde);
      margin: 0 2px;
    }

    .conmutador {
      height: 24px;
      padding: 0 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--tenue);
      background: var(--crema);
      border: 1px solid var(--borde);
      border-radius: var(--radio-chico);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .conmutador:hover {
      color: var(--tinta-media);
    }

    .conmutador[aria-pressed=true] {
      color: var(--madera);
      background: rgba(212, 184, 150, 0.4);
      border-color: var(--madera-clara);
    }

    .conmutador:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .grupo-zoom {
      display: flex;
      gap: 2px;
    }

    .boton-zoom {
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--crema);
      border: 1px solid var(--borde);
      font-size: 12px;
      font-weight: 700;
      color: var(--tenue);
      cursor: pointer;
    }

    .boton-zoom:hover {
      color: var(--terracota);
      border-color: var(--terracota-clara);
      background: #fff;
    }

    .menu-exportar {
      position: relative;
    }

    .boton-exportar {
      height: 24px;
      padding: 0 9px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      background: rgba(155, 176, 143, 0.14);
      border: 1px solid var(--salvia-clara);
      border-radius: var(--radio-chico);
      cursor: pointer;
    }

    .boton-exportar:hover {
      background: rgba(155, 176, 143, 0.28);
    }

    .desplegable {
      position: absolute;
      right: 0;
      top: 30px;
      z-index: 30;
      width: 236px;
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: var(--radio-medio);
      box-shadow: var(--sombra-media);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .desplegable[hidden] {
      display: none;
    }

    .desplegable .fila > label {
      min-width: 60px;
    }

    .opcion-menu {
      text-align: left;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      font-size: 11.5px;
      color: var(--tinta);
      cursor: pointer;
    }

    .opcion-menu:hover {
      background: var(--crema);
      color: var(--terracota);
    }

    .opcion-menu small {
      display: block;
      font-size: 10px;
      color: var(--tenue);
    }

    .linea-menu {
      height: 1px;
      background: var(--crema-oscura);
      margin: 3px 0;
    }

    .caja-lienzo {
      flex: 1;
      position: relative;
      min-height: 0;
      outline: none;
    }

    .caja-lienzo:focus-visible {
      box-shadow: inset 0 0 0 2px var(--salvia);
    }

    .caja-lienzo canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .aviso-grafico {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      max-width: 78%;
      background: #fff;
      border: 1px solid var(--terracota-clara);
      border-left: 3px solid var(--terracota);
      border-radius: var(--radio-chico);
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
      pointer-events: none;
    }

    .aviso-grafico[hidden] {
      display: none;
    }

    .editor-flotante {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 1px solid var(--terracota);
      border-radius: var(--radio-chico);
      padding: 4px 6px;
      box-shadow: var(--sombra-media);
    }

    .editor-flotante[hidden] {
      display: none;
    }

    .editor-flotante input {
      width: 86px;
      height: 26px;
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 0 6px;
    }

    .editor-flotante span {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tenue);
    }

    .barra-inferior {
      min-height: 48px;
      border-top: 1px solid var(--borde);
      background: var(--crema-clara);
      display: flex;
      align-items: center;
      padding: 5px 14px;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .dato {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .dato-rotulo {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--tenue);
    }

    .dato-valor {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--tinta-media);
      white-space: nowrap;
    }

    .dato-sep {
      width: 1px;
      height: 26px;
      background: var(--borde);
    }

    .ayuda-teclado {
      margin-left: auto;
      font-size: 10px;
      color: var(--tenue);
      font-style: italic;
    }

    .oculto {
      display: none !important;
    }

    .version-basica .solo-avanzada,
    .version-avanzada .solo-basica {
      display: none !important;
    }

    .selector-version {
      display: flex;
      padding: 2px;
      border-radius: 20px;
      background: rgba(44, 36, 22, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .selector-version button {
      height: 24px;
      padding: 0 12px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: rgba(253, 248, 243, 0.78);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .selector-version button:hover {
      color: var(--crema-clara);
    }

    .selector-version button[aria-pressed=true] {
      background: var(--crema-clara);
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
    }

    .bloqueado {
      opacity: 0.5;
      pointer-events: none;
    }

    @media (max-width: 940px) {
      html,
      body {
        overflow: auto;
        height: auto;
      }

      .cuerpo {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .panel-izq {
        border-right: 0;
        border-bottom: 1px solid var(--borde);
      }

      .panel-scroll {
        max-height: 52vh;
      }

      .panel-der {
        min-height: 620px;
      }

      .caja-lienzo {
        min-height: 460px;
      }

      .medidor-valor {
        display: none;
      }

      .cab-titulo {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boton-reproducir.sonando {
        animation: none;
      }

      * {
        transition: none !important;
      }
    }

    .incrustado .cabecera {
      display: none;
    }
  </style>
</head>

  <script type="text/html" id="moduloEcualizadores">
<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesos Espectrales - Ecualizadores · Mimetika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --crema-clara: #FDF8F3;
      --crema: #F5EBE0;
      --crema-oscura: #E8DCCD;
      --salvia-clara: #C5D4C0;
      --salvia: #9BB08F;
      --salvia-oscura: #7A9A6D;
      --terracota-clara: #D4847C;
      --terracota: #B85C50;
      --terracota-oscura: #8B3A30;
      --arena: #D4B896;
      --madera-clara: #A67B5B;
      --madera: #8B6F47;
      --tinta: #2C2416;
      --tinta-media: #5C544D;
      --tenue: #8A817A;
      --borde: #D4C8BC;
      --sombra-chica: 0 1px 3px rgba(44, 36, 22, 0.08);
      --sombra-media: 0 4px 12px rgba(44, 36, 22, 0.12);
      --radio-chico: 6px;
      --radio-medio: 10px;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: var(--sans);
      background: var(--crema);
      color: var(--tinta);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button,
    select,
    input {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--terracota);
      outline-offset: 2px;
    }

    .cabecera {
      background: linear-gradient(135deg, var(--terracota) 0%, var(--terracota-oscura) 100%);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--sombra-media);
      flex-shrink: 0;
      z-index: 10;
    }

    .cab-izq {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cab-icono {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: var(--radio-chico);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cab-icono svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
    }

    .cab-marca {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(253, 248, 243, 0.72);
      letter-spacing: 0.2px;
    }

    .cab-titulo {
      font-size: 16px;
      font-weight: 700;
      color: var(--crema-clara);
      line-height: 1.2;
      white-space: nowrap;
    }

    .cab-der {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .medidor {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .medidor-barras {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 18px;
    }

    .medidor-barras span {
      width: 4px;
      border-radius: 1px;
      opacity: 0.18;
      transition: opacity 0.06s linear;
    }

    .medidor-barras span.prendida {
      opacity: 1;
    }

    .medidor-valor {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--crema-clara);
      min-width: 78px;
      text-align: right;
    }

    .cab-version {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--crema-clara);
      border-radius: 20px;
    }

    .cuerpo {
      display: grid;
      grid-template-columns: 344px 1fr;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .panel-izq {
      background: var(--crema-clara);
      border-right: 1px solid var(--borde);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 9px 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
    }

    .panel-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .panel-scroll::-webkit-scrollbar-thumb {
      background: var(--crema-oscura);
      border-radius: 2px;
    }

    .tarjeta {
      background: #fff;
      border-radius: var(--radio-medio);
      border: 1px solid var(--borde);
      box-shadow: var(--sombra-chica);
      flex-shrink: 0;
    }

    .tarjeta-cabeza {
      width: 100%;
      padding: 8px 11px;
      background: var(--crema-clara);
      border: 0;
      border-bottom: 1px solid var(--crema-oscura);
      border-radius: var(--radio-medio) var(--radio-medio) 0 0;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      text-align: left;
      color: var(--tinta-media);
    }

    .tarjeta-cabeza:hover {
      background: var(--crema);
    }

    .tarjeta-cabeza svg.icono {
      width: 13px;
      height: 13px;
      stroke: var(--terracota);
      flex-shrink: 0;
    }

    .tarjeta-cabeza h3 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1px;
      flex: 1;
    }

    .tarjeta-cabeza .flecha {
      width: 14px;
      height: 14px;
      stroke: var(--tenue);
      transition: transform 0.2s ease;
    }

    .tarjeta.plegada .tarjeta-cabeza {
      border-bottom-color: transparent;
      border-radius: var(--radio-medio);
    }

    .tarjeta.plegada .flecha {
      transform: rotate(-90deg);
    }

    .tarjeta.plegada .tarjeta-cuerpo {
      display: none;
    }

    .tarjeta-cuerpo {
      padding: 10px 11px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .fila {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--tinta-media);
    }

    .fila > label,
    .fila > .rotulo {
      font-weight: 500;
      min-width: 80px;
      font-size: 11px;
    }

    .fila select,
    .fila input[type=text] {
      flex: 1;
      min-width: 0;
      height: 30px;
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 4px 8px;
      border: 1px solid var(--borde);
      border-radius: var(--radio-chico);
      background: var(--crema-clara);
      color: var(--tinta);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .fila input[type=text] {
      text-align: right;
    }

    .fila select:focus,
    .fila input[type=text]:focus {
      outline: none;
      border-color: var(--salvia);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(155, 176, 143, 0.2);
    }

    .fila input.invalido {
      border-color: var(--terracota);
      box-shadow: 0 0 0 3px rgba(184, 92, 80, 0.15);
    }

    .fila .unidad {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tenue);
      min-width: 26px;
    }

    .fila-doble {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }

    .fila-doble .fila {
      min-width: 0;
    }

    .fila-doble .fila > label {
      min-width: 0;
    }

    .control-rango {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--crema-oscura);
      cursor: pointer;
    }

    .control-rango::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--salvia-oscura);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: var(--sombra-chica);
    }

    .control-rango::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--salvia-oscura);
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .mensaje-error {
      font-size: 10.5px;
      color: var(--terracota-oscura);
      background: rgba(184, 92, 80, 0.08);
      border-left: 2px solid var(--terracota);
      padding: 5px 8px;
      border-radius: 0 var(--radio-chico) var(--radio-chico) 0;
    }

    .nota {
      font-size: 10.5px;
      color: var(--tenue);
      line-height: 1.5;
    }

    .casillas {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    .casilla {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--tinta-media);
      cursor: pointer;
      white-space: nowrap;
    }

    .casilla input {
      accent-color: var(--terracota);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .tabla-secciones {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 10.5px;
    }

    .tabla-secciones th {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 10px;
      color: var(--tenue);
      text-align: left;
      padding: 3px 4px;
      border-bottom: 1px solid var(--crema-oscura);
    }

    .tabla-secciones td {
      padding: 3px 4px;
      color: var(--tinta);
      border-bottom: 1px solid var(--crema);
    }

    .tabla-secciones td.num,
    .tabla-secciones th.num {
      text-align: right;
    }

    .tabla-secciones tr.recortada td {
      color: var(--terracota-oscura);
    }

    .resumen-secciones {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--terracota);
      background: var(--crema-clara);
      border: 1px solid var(--crema-oscura);
      border-radius: 10px;
      padding: 4px 9px;
      text-align: center;
    }

    .boton {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radio-chico);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }

    .boton:hover {
      transform: translateY(-1px);
    }

    .boton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .boton-salvia {
      border-color: var(--salvia-clara);
      background: rgba(155, 176, 143, 0.16);
      color: var(--salvia-oscura);
    }

    .boton-salvia:hover:not(:disabled) {
      background: var(--salvia);
      color: #fff;
    }

    .boton-terracota {
      border-color: var(--terracota-clara);
      background: rgba(184, 92, 80, 0.08);
      color: var(--terracota);
    }

    .boton-terracota:hover:not(:disabled) {
      background: var(--terracota);
      color: #fff;
    }

    .boton-madera {
      border-color: var(--arena);
      background: rgba(212, 184, 150, 0.22);
      color: var(--madera);
    }

    .boton-madera:hover:not(:disabled) {
      background: var(--madera-clara);
      color: #fff;
    }

    .botonera {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .lista-curvas {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .lista-curvas li {
      border: 1px solid var(--crema-oscura);
      border-radius: var(--radio-chico);
      padding: 6px 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--crema-clara);
    }

    .lista-curvas li.apagada {
      opacity: 0.55;
    }

    .lista-curvas li.escuchando {
      border-color: var(--salvia-oscura);
      box-shadow: 0 0 0 2px rgba(122, 154, 109, 0.2);
    }

    .curva-linea {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .curva-muestra {
      width: 22px;
      height: 0;
      border-top: 3px solid;
      flex-shrink: 0;
    }

    .curva-nombre {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 3px 5px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--tinta);
    }

    .curva-nombre:hover,
    .curva-nombre:focus {
      border-color: var(--borde);
      background: #fff;
      outline: none;
    }

    .curva-acciones {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .curva-acciones select {
      height: 24px;
      font-size: 10px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      background: #fff;
      color: var(--tinta-media);
      padding: 0 3px;
    }

    .mini {
      height: 24px;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--borde);
      background: #fff;
      color: var(--tinta-media);
      cursor: pointer;
    }

    .mini:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mini:hover:not(:disabled) {
      border-color: var(--terracota-clara);
      color: var(--terracota);
    }

    .mini.prendido {
      background: var(--salvia-oscura);
      border-color: var(--salvia-oscura);
      color: #fff;
    }

    .caja-consejo {
      background: linear-gradient(135deg, rgba(155, 176, 143, 0.14), rgba(155, 176, 143, 0.04));
      border: 1px solid var(--salvia-clara);
      border-radius: var(--radio-chico);
      padding: 9px 11px;
      font-size: 11px;
      color: var(--tinta-media);
      line-height: 1.6;
      flex-shrink: 0;
    }

    .caja-consejo strong {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      margin-bottom: 2px;
    }

    .caja-consejo p + p {
      margin-top: 5px;
    }

    .devolucion {
      font-size: 11px;
      line-height: 1.6;
      border-radius: var(--radio-chico);
      padding: 7px 9px;
      background: var(--crema-clara);
      border: 1px solid var(--crema-oscura);
    }

    .devolucion .bien {
      color: var(--salvia-oscura);
      font-weight: 600;
    }

    .devolucion .mal {
      color: var(--terracota);
      font-weight: 600;
    }

    .marcador {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--madera);
      text-align: center;
    }

    .historial {
      list-style: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tinta-media);
      max-height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pie-audio {
      border-top: 1px solid var(--borde);
      background: var(--crema-clara);
      padding: 9px 9px 10px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .boton-reproducir {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      background: linear-gradient(135deg, var(--salvia) 0%, var(--salvia-oscura) 100%);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      border: 0;
      border-radius: var(--radio-medio);
      cursor: pointer;
      box-shadow: var(--sombra-chica);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .boton-reproducir svg {
      width: 13px;
      height: 13px;
    }

    .boton-reproducir:hover {
      transform: translateY(-1px);
      box-shadow: var(--sombra-media);
    }

    .boton-reproducir.sonando {
      background: linear-gradient(135deg, var(--terracota-clara), var(--terracota));
      animation: latido 2s ease-in-out infinite;
    }

    @keyframes latido {
      0%, 100% { box-shadow: var(--sombra-chica); }
      50% { box-shadow: 0 0 0 5px rgba(184, 92, 80, 0.18), var(--sombra-chica); }
    }

    .valor-nivel {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      min-width: 58px;
      text-align: right;
    }

    .interruptor {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--tinta-media);
    }

    .llave {
      position: relative;
      width: 32px;
      height: 17px;
      flex-shrink: 0;
    }

    .llave input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .llave-pista {
      position: absolute;
      inset: 0;
      background: var(--crema-oscura);
      border: 1px solid var(--borde);
      border-radius: 9px;
      transition: background 0.15s;
      pointer-events: none;
    }

    .llave-pista::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--sombra-chica);
      transition: left 0.15s;
    }

    .llave input:checked + .llave-pista {
      background: var(--salvia-oscura);
      border-color: var(--salvia-oscura);
    }

    .llave input:checked + .llave-pista::after {
      left: calc(100% - 13px);
    }

    .llave input:focus-visible + .llave-pista {
      outline: 2px solid var(--terracota);
      outline-offset: 2px;
    }

    .panel-der {
      display: flex;
      flex-direction: column;
      background: var(--crema-clara);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .barra-herramientas {
      padding: 8px 14px;
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .grafico-titulo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .grafico-subtitulo {
      font-size: 10.5px;
      color: var(--tenue);
      margin-top: 1px;
    }

    .herramientas {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .pastilla {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
    }

    .pastilla-fc {
      color: var(--salvia-oscura);
      border-color: var(--salvia);
      background: rgba(155, 176, 143, 0.1);
    }

    .pastilla-tipo {
      color: var(--terracota);
      border-color: var(--terracota-clara);
      background: rgba(184, 92, 80, 0.07);
    }

    .pastilla-pend {
      color: var(--madera);
      border-color: var(--arena);
      background: rgba(166, 123, 91, 0.08);
    }

    .separador {
      width: 1px;
      height: 16px;
      background: var(--borde);
      margin: 0 2px;
    }

    .conmutador {
      height: 24px;
      padding: 0 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--tenue);
      background: var(--crema);
      border: 1px solid var(--borde);
      border-radius: var(--radio-chico);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .conmutador:hover {
      color: var(--tinta-media);
    }

    .conmutador[aria-pressed=true] {
      color: var(--madera);
      background: rgba(212, 184, 150, 0.4);
      border-color: var(--madera-clara);
    }

    .conmutador:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .grupo-zoom {
      display: flex;
      gap: 2px;
    }

    .boton-zoom {
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--crema);
      border: 1px solid var(--borde);
      font-size: 12px;
      font-weight: 700;
      color: var(--tenue);
      cursor: pointer;
    }

    .boton-zoom:hover {
      color: var(--terracota);
      border-color: var(--terracota-clara);
      background: #fff;
    }

    .menu-exportar {
      position: relative;
    }

    .boton-exportar {
      height: 24px;
      padding: 0 9px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--salvia-oscura);
      background: rgba(155, 176, 143, 0.14);
      border: 1px solid var(--salvia-clara);
      border-radius: var(--radio-chico);
      cursor: pointer;
    }

    .boton-exportar:hover {
      background: rgba(155, 176, 143, 0.28);
    }

    .desplegable {
      position: absolute;
      right: 0;
      top: 30px;
      z-index: 30;
      width: 236px;
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: var(--radio-medio);
      box-shadow: var(--sombra-media);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .desplegable[hidden] {
      display: none;
    }

    .desplegable .fila > label {
      min-width: 60px;
    }

    .opcion-menu {
      text-align: left;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      font-size: 11.5px;
      color: var(--tinta);
      cursor: pointer;
    }

    .opcion-menu:hover {
      background: var(--crema);
      color: var(--terracota);
    }

    .opcion-menu small {
      display: block;
      font-size: 10px;
      color: var(--tenue);
    }

    .linea-menu {
      height: 1px;
      background: var(--crema-oscura);
      margin: 3px 0;
    }

    .caja-lienzo {
      flex: 1;
      position: relative;
      min-height: 0;
      outline: none;
    }

    .caja-lienzo:focus-visible {
      box-shadow: inset 0 0 0 2px var(--salvia);
    }

    .caja-lienzo canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .aviso-grafico {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      max-width: 78%;
      background: #fff;
      border: 1px solid var(--terracota-clara);
      border-left: 3px solid var(--terracota);
      border-radius: var(--radio-chico);
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
      pointer-events: none;
    }

    .aviso-grafico[hidden] {
      display: none;
    }

    .editor-flotante {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 1px solid var(--terracota);
      border-radius: var(--radio-chico);
      padding: 4px 6px;
      box-shadow: var(--sombra-media);
    }

    .editor-flotante[hidden] {
      display: none;
    }

    .editor-flotante input {
      width: 86px;
      height: 26px;
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 0 6px;
    }

    .editor-flotante span {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tenue);
    }

    .barra-inferior {
      min-height: 48px;
      border-top: 1px solid var(--borde);
      background: var(--crema-clara);
      display: flex;
      align-items: center;
      padding: 5px 14px;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .dato {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .dato-rotulo {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--tenue);
    }

    .dato-valor {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--tinta-media);
      white-space: nowrap;
    }

    .dato-sep {
      width: 1px;
      height: 26px;
      background: var(--borde);
    }

    .ayuda-teclado {
      margin-left: auto;
      font-size: 10px;
      color: var(--tenue);
      font-style: italic;
    }

    .oculto {
      display: none !important;
    }

    .version-basica .solo-avanzada,
    .version-avanzada .solo-basica {
      display: none !important;
    }

    .selector-version {
      display: flex;
      padding: 2px;
      border-radius: 20px;
      background: rgba(44, 36, 22, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .selector-version button {
      height: 24px;
      padding: 0 12px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: rgba(253, 248, 243, 0.78);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .selector-version button:hover {
      color: var(--crema-clara);
    }

    .selector-version button[aria-pressed=true] {
      background: var(--crema-clara);
      color: var(--terracota-oscura);
      box-shadow: var(--sombra-chica);
    }

    .bloqueado {
      opacity: 0.5;
      pointer-events: none;
    }

    @media (max-width: 940px) {
      html,
      body {
        overflow: auto;
        height: auto;
      }

      .cuerpo {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .panel-izq {
        border-right: 0;
        border-bottom: 1px solid var(--borde);
      }

      .panel-scroll {
        max-height: 52vh;
      }

      .panel-der {
        min-height: 620px;
      }

      .caja-lienzo {
        min-height: 460px;
      }

      .medidor-valor {
        display: none;
      }

      .cab-titulo {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boton-reproducir.sonando {
        animation: none;
      }

      * {
        transition: none !important;
      }
    }

    .tira-bandas {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .chip-banda {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--borde);
      border-radius: var(--radio-chico);
      background: var(--crema-clara);
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--tinta-media);
      cursor: pointer;
    }

    .chip-banda .punto {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chip-banda[aria-selected=true] {
      border-color: var(--terracota);
      background: #fff;
      color: var(--terracota-oscura);
      box-shadow: 0 0 0 2px rgba(184, 92, 80, 0.15);
    }

    .chip-banda.apagada {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .botonera-bandas {
      margin-bottom: 6px;
    }

    .casilla-banda {
      margin-bottom: 2px;
    }

    .paso {
      width: 28px;
      height: 30px;
      flex-shrink: 0;
      border: 1px solid var(--borde);
      border-radius: var(--radio-chico);
      background: var(--crema);
      color: var(--tinta-media);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .paso:hover {
      color: var(--terracota);
      border-color: var(--terracota-clara);
      background: #fff;
    }

    .rango-ganancia {
      width: 100%;
      margin: 2px 0 4px;
    }

    .dos-campos {
      display: grid;
